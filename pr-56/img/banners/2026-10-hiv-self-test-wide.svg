<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d"><title id="t">示意插畫：溫暖的諮詢室裡，個管師與民眾面對面坐著談話</title><desc id="d">柔和燈光的諮詢室，兩張扶手椅面對面，一位個管師與一位民眾坐著交談，小圓桌上有茶杯、面紙盒與自我篩檢試劑盒；牆上掛著紅絲帶畫框，旁邊有落地燈與盆栽。主體在畫面右側，左側為窗簾與暖光。</desc><defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe7dc"/><stop offset="1" stop-color="#f4cdb8"/></linearGradient><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a98d"/><stop offset="1" stop-color="#c58b6e"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#ffe9b8"/><stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#w)" /><rect x="70" y="60" width="380" height="470" rx="10" fill="#fff3e4" /><rect x="90" y="80" width="340" height="430" rx="6" fill="#f6c9a4" /><circle cx="260" cy="330" r="220" fill="url(#glow)" opacity=".7"/><path d="M60 40H270V540H60z" fill="#e9b79c" opacity=".95"/><path d="M100 40V540" stroke="#d99d80" stroke-width="5"/><path d="M140 40V540" stroke="#d99d80" stroke-width="5"/><path d="M180 40V540" stroke="#d99d80" stroke-width="5"/><path d="M220 40V540" stroke="#d99d80" stroke-width="5"/><path d="M330 40H470V540H330z" fill="#e9b79c" /><path d="M370 40V540" stroke="#d99d80" stroke-width="5"/><path d="M410 40V540" stroke="#d99d80" stroke-width="5"/><path d="M450 40V540" stroke="#d99d80" stroke-width="5"/><rect x="40" y="36" width="450" height="14" rx="7" fill="#9a6a52" /><rect x="560" y="0" width="640" height="560" rx="0" fill="#f8e0d2" /><rect x="560" y="470" width="640" height="90" rx="0" fill="#efc9b6" /><rect x="840" y="80" width="240" height="290" rx="10" fill="#fff7ef" stroke="#b98a6f" stroke-width="10"/><g transform="translate(960 224)" ><path d="M0 -20C-40 -110 -110 -90 -80 -30C-60 10 -20 10 0 -20z" fill="#c0262d" /><path d="M0 -20C40 -110 110 -90 80 -30C60 10 20 10 0 -20z" fill="#d73