name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每 2 小時重建一次（第九輪 17.2）：讓 publishAt 排程發布到點上線、逾期與白名單狀態跟著時間更新。
    # 重抓官方資料（旅遊疫情、國家等級、CKAN 目錄）並回寫快照只在 02:00 UTC（台灣 10:00）那一次做，其餘只建置。
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: '重抓官方資料並把快照回寫 main（content-pr.yml 為了預覽／合併觸發時傳 false）'
        type: boolean
        default: true

# 第二十三輪（26.5）：工作流程層級唯讀，寫入權限下放到 job：build 要 commit 快照回 main（contents: write）；deploy 只要 pages／id-token。
permissions:
  contents: read

# 第六十八輪（docs/deploy.md 第 34 節）：cancel-in-progress 改 false。以前「新的來就取消舊的」：多個 PR 在幾分鐘內陸續合併，每次合併都把
# 前一次建置取消，只要每隔不到一次建置的時間（約 4 分鐘）就有人合併，部署永遠跑不完。現在同一時間最多「一個在跑＋一個排隊」：
# 正在跑的做完，排隊的那次從當時的 main 建站（期間所有合併都包含在內）；再來的觸發只會取代排隊中的那次（GitHub 只保留最新一個 pending）。
# 任何人從合併到上線最多等兩次建置（約 9–10 分鐘），而且不論合併多密集都會收斂。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 第六十輪（Issue #126，docs/deploy.md 第 29 節）：這次 push 是不是「純內容」（只改 content/、data/snapshots/）。
  # 用 GitHub API 比對 before…after 的檔案清單，不 checkout、不執行任何 repo 內的程式；排程、手動執行、新分支、檔數超過 API 上限（300）一律當程式變更（全跑）。
  # 純內容 ⇒ build job 只跑內容測試（test:content，PR 階段就是這套）就建置、部署；完整程式測試改由 verify job 平行跑、不擋部署。
  # 程式變更 ⇒ build job 照舊先跑 lint／格式／型別／完整測試再建置。
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      content_only: ${{ steps.scope.outputs.content_only }}
    steps:
      - name: Classify this push (content-only or code) via the compare API
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          CONTENT_ONLY=false
          if [ "$EVENT" = "push" ] && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && [[ ! "$BEFORE" =~ ^0{40}$ ]]; then
            if gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" > "$RUNNER_TEMP/compare.json" 2> "$RUNNER_TEMP/compare.err"; then
              TOTAL="$(jq -r '.files | length' "$RUNNER_TEMP/compare.json")"
              # compare API 最多列 300 個檔；達到上限就無法確認「全部都是內容」，當程式變更
              if [ "$TOTAL" -gt 0 ] && [ "$TOTAL" -lt 300 ]; then
                jq -r '.files[] | .filename, (.previous_filename // empty)' "$RUNNER_TEMP/compare.json" > "$RUNNER_TEMP/files.txt"
                if ! grep -Ev '^(content|data/snapshots)/' "$RUNNER_TEMP/files.txt" > /dev/null; then CONTENT_ONLY=true; fi
                echo "變更 $TOTAL 個檔；純內容＝$CONTENT_ONLY"
              else
                echo "變更檔數 $TOTAL（0 或達 API 上限）⇒ 當程式變更全跑"
              fi
            else
              echo "::warning::compare API 失敗，當程式變更全跑：$(head -c 300 "$RUNNER_TEMP/compare.err")"
            fi
          else
            echo "事件 $EVENT（非 push 或無 before）⇒ 全跑"
          fi
          echo "content_only=$CONTENT_ONLY" >> "$GITHUB_OUTPUT"

  build:
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: write # 排程／手動執行時把官方資料快照 commit 回 main
      pull-requests: read # 取 previews 時查 PR 是否還開著（已合併／關閉的預覽不再放進 /preview/）
    env:
      CONTENT_ONLY: ${{ needs.scope.outputs.content_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      # 第五十六輪（docs/deploy.md 第 28 節）：替 content-pr.yml 的程式 PR 存 Chromium 快取。PR 那邊只還原（actions/cache/restore）、不寫入，
      # 所以別人會用到的快取只來自 main 上這一步（PR 讀得到 base 分支的快取；PR 存的快取 main 與其他 PR 讀不到）。
      # key 是 package-lock.json 的 playwright-core 版本：命中時這三步不到幾秒；只有升級 Playwright 後的第一次部署下載一次。
      # 每 2 小時的排程都會還原一次，快取不會因 7 天沒用到而被清掉。
      - name: Playwright version (Chromium cache key)
        id: pw
        run: echo "version=$(jq -r '.packages["node_modules/playwright-core"].version // "none"' package-lock.json | tr -cd '0-9A-Za-z.-')" >> "$GITHUB_OUTPUT"
      - name: Chromium cache for content-pr (restore, or download once and save)
        id: pwcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Download Chromium into the cache (cache miss only)
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Lint (eslint) + format check + type check (code pushes, schedule and manual runs)
        if: env.CONTENT_ONLY != 'true'
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
      - name: Tests (governance rules, on committed content)
        if: env.CONTENT_ONLY != 'true'
        run: npm test
      # 第六十輪（Issue #126）：純內容的合併只跑內容測試（與 PR 階段相同的 test:content），完整測試在下面的 verify job 平行跑
      - name: Content tests only (content-only push; full npm test runs in the verify job in parallel)
        if: env.CONTENT_ONLY == 'true'
        run: npm run test:content
      - name: Decide whether to refresh official data (manual run, or the 02 UTC schedule)
        id: refresh
        env:
          EVENT: ${{ github.event_name }}
          INPUT_REFRESH: ${{ github.event.inputs.refresh }}
        run: |
          REFRESH=false
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_REFRESH" != "false" ]; then REFRESH=true; fi
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%H)" = "02" ]; then REFRESH=true; fi
          echo "refresh=$REFRESH" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT refresh=$REFRESH（UTC $(date -u +%H) 時）"
      - name: Fetch live data from official sources (falls back to snapshots)
        if: steps.refresh.outputs.refresh == 'true'
        run: npm run fetch
        continue-on-error: true
        env:
          # 國際重要疫情資訊（docs/intl-epidemic.md）：有設就改拉疫情中心資料庫的 v1 feed；沒設（空字串）＝維持現行官網 ExportJSON
          INTL_FEED_URL: ${{ secrets.INTL_FEED_URL }}
          INTL_FEED_TOKEN: ${{ secrets.INTL_FEED_TOKEN }}
      # 第五十七輪（docs/denguemap-integration.md 2.4）：登革熱地圖每 3 小時更新，官方資料的全量重抓一天只有一次；
      # 所以每次建置前只重抓登革熱地圖的 summary＋manifest（先 Pages 版、再 raw 版），疾病頁疫情小卡的數字最多落後地圖一個建置週期。
      # 結果只用於這次建置、不 commit（02 UTC 那次由上一步的完整 fetch 一起回寫）；抓不到就沿用已提交的快照，小卡依 48 小時規則自動降級。
      - name: Refresh dengue map summary (every build; falls back to the committed snapshot)
        if: steps.refresh.outputs.refresh != 'true'
        run: node scripts/fetch-data.mjs --denguemap
        continue-on-error: true
      - name: Commit refreshed snapshots back to main (02 UTC schedule / manual runs only)
        if: steps.refresh.outputs.refresh == 'true'
        env:
          # 第六十輪（Issue #124，docs/deploy.md §29.1）：main 的規則集禁止直接 push，而 GitHub Actions 不能列入繞過名單（介面沒有這個選項）；
          # 「部署金鑰」可以。有設 SNAPSHOT_DEPLOY_KEY（有寫入權的部署金鑰私鑰）就用它經 SSH 推；沒設就用 GITHUB_TOKEN 試推。
          SNAPSHOT_DEPLOY_KEY: ${{ secrets.SNAPSHOT_DEPLOY_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # npm run fetch 除了 data/snapshots/ 也會改 content/datasets/（登革熱地圖摘要與 CKAN 目錄的 lastUpdated／provenance，第五十七輪），
          # 一起提交；其他未預期的變更列出來但不提交。rebase 前先把它們 stash（--autostash），否則 git 會以「You have unstaged changes」拒絕（2026-10-25 實測，run #328）。
          git add -A data/snapshots content/datasets
          if git diff --cached --quiet; then echo "快照無變更"; exit 0; fi
          if [ -n "$(git status --porcelain)" ]; then echo "::notice::快照之外還有未提交的變更（不提交）："; git status --porcelain | grep -v '^[MADR] ' || true; fi
          git commit -m "data: 官方資料快照更新（$(date -u +%F)）"
          if ! git pull --rebase --autostash origin main; then
            echo "::warning::快照 rebase 到最新 main 失敗，這次不回寫。建置照常進行"
            git rebase --abort 2>/dev/null || true
            exit 0
          fi
          if [ -n "$SNAPSHOT_DEPLOY_KEY" ]; then
            umask 077
            printf '%s\n' "$SNAPSHOT_DEPLOY_KEY" > "$RUNNER_TEMP/snapshot_key"
            mkdir -p ~/.ssh && ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            if GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/snapshot_key -o IdentitiesOnly=yes" git push "git@github.com:${GITHUB_REPOSITORY}.git" HEAD:main; then
              echo "快照已以部署金鑰回寫 main"
            else
              echo "::warning::部署金鑰回寫 main 失敗：確認金鑰有寫入權、規則集的繞過名單含「Deploy keys」（docs/deploy.md §29.1）。建置照常進行"
            fi
            rm -f "$RUNNER_TEMP/snapshot_key"
          elif git push origin HEAD:main; then
            echo "快照已回寫 main"
          else
            # 只警告、不讓建置失敗：這次建置仍用重抓到的資料，快照留到下次（或設定部署金鑰）
            echo "::warning::快照回寫 main 被規則集拒絕（GITHUB_TOKEN 不能繞過）。建置照常進行；請設定部署金鑰 SNAPSHOT_DEPLOY_KEY（docs/deploy.md §29.1）"
          fi
      # 第三十八輪（deploy.md 2.1）：只放「還開著」的 PR 的預覽。previews 分支上已合併／關閉的 pr-N/ 在這裡就略過，
      # 不必等 preview-cleanup.yml 刪掉分支上的目錄再部署一次；人工合併時 push 觸發的這一次部署就是最終版，
      # 自動合併（GITHUB_TOKEN，不觸發 closed 事件）的預覽也會在合併後的第一次部署就消失，不用等每日排程。
      # 查不到狀態（API 暫時失敗）就保留，寧可多放一份預覽也不要讓預覽忽有忽無。
      - name: Fetch PR previews (previews branch → dist/preview/ after build; open PRs only; skipped if the branch does not exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git fetch --depth 1 origin +refs/heads/previews:refs/remotes/origin/previews 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/previews"
            git --work-tree="$RUNNER_TEMP/previews" checkout origin/previews -- .
            git reset --quiet # 上一行會改到 index，還原（工作目錄不受影響）
            for d in "$RUNNER_TEMP"/previews/pr-*/; do
              [ -d "$d" ] || continue
              n="$(basename "$d")"; n="${n#pr-}"
              state="$(gh pr view "$n" -R "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo UNKNOWN)"
              case "$state" in
                OPEN|UNKNOWN) ;;
                *) rm -rf "$d"; echo "pr-$n 的 PR 已 $state，不放進 /preview/" ;;
              esac
            done
            echo "PREVIEWS_DIR=$RUNNER_TEMP/previews" >> "$GITHUB_ENV"
            ls "$RUNNER_TEMP/previews"
          else
            echo "previews 分支不存在，略過 PR 預覽"
          fi
      # 建置同時產生 Pagefind 全文索引 dist/pagefind/（第二十八輪，約 20 秒；build.mjs 內建，沒有另外的步驟）。
      # 索引失敗或收不到任何頁時 build 會 exit 1，不會把沒有索引的 /search/ 發布出去。
      - name: Build (schema gate + eval gate + static site + full-text index)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # 原型凍結「今天」在 2026-10-01：示意內容的審閱日與態勢資料日以此為基準，
          # 讓治理案例（逾期、失效、依據已修訂）維持可展示；移除此行即以真實日期計算。
          # publishAt 排程發布不受此影響，一律以建置當下的真實時間判斷。
          BUILD_TODAY: ${{ vars.BUILD_TODAY || '2026-10-01' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          # 建置在站內連結檢查之後，把 PREVIEWS_DIR 的 pr-N/ 複製到 dist/preview/
        run: npm run build
      - name: Check PR previews are in the upload (dist/preview)
        run: |
          if [ -d dist/preview ]; then ls dist/preview; du -sh dist/preview; else echo "沒有 PR 預覽"; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist # 含 dist/preview/pr-N/
  # 第六十輪（Issue #126）：純內容合併時，完整程式測試（lint／格式／型別／npm test）平行跑、不擋部署。
  # 內容不會改程式，這些測試在合併前的 PR 已跑過（程式 PR）或與內容無關；真正擋壞內容的是 build 內的 schema／治理／評估／連結閘門。
  # 失敗時這個 job 紅、工作流程紅（通知送給維護者），但網站已照 build job 的結果部署；處理方式見 docs/deploy.md 第 29 節。
  verify:
    needs: scope
    if: needs.scope.outputs.content_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Lint (eslint) + format check + type check
        run: |
          npm run lint
          npm run format:check
          npm run typecheck
      - name: Full tests (npm test; does not gate the deploy of a content-only push)
        run: npm test
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
