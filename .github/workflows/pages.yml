name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每日 03:00 UTC（台灣 11:00）重抓官方資料並重建：旅遊疫情、國家等級、CKAN 目錄
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch live data from official sources (falls back to snapshots)
        run: npm run fetch
        continue-on-error: true
      - name: Tests (governance rules)
        run: npm test
      - name: Build (schema gate + eval gate + static site)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # 原型凍結「今天」在 2026-10-01：示意內容的審閱日與態勢資料日以此為基準，
          # 讓治理案例（逾期、失效、依據已修訂）維持可展示；移除此行即以真實日期計算。
          BUILD_TODAY: ${{ vars.BUILD_TODAY || '2026-10-01' }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
