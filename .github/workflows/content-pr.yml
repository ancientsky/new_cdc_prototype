name: Content PR lane (checks, preview, auto-merge)

# 第九輪（ARCHITECTURE 17.2）：PR 進來 → 測試與治理閘門 → 判定車道（scripts/lane.mjs）→ 建置預覽並推到 previews 分支
# → 觸發主站重新部署（把 previews 複製到 /preview/）→ PR 留言（車道、檢查、預覽網址、SLA、審核人）→ 標籤 lane:*
# → 快車道／緊急發布：檢查全過即 squash 合併；一般車道：有核准（每位審核人最新一則為 APPROVED）且檢查全過才合併。
# 注意：GITHUB_TOKEN 造成的 push／closed 事件不會再觸發其他工作流程（GitHub 規則），
#       所以合併後本流程自己再 `gh workflow run pages.yml`；預覽清理另有 preview-cleanup.yml 的每日排程補做。
#
# 第四十輪（#81）：拆成兩個 job，把「執行 PR 程式碼」和「持有寫入權杖」分開。
#   test ：contents: read。npm ci、lint、format、typecheck、npm test、build、a11y、lane.mjs、預覽建置全在這裡——
#          PR 的 package.json 腳本、相依套件的 postinstall、測試檔都在這個 job 裡執行，能拿到的最多是唯讀權杖。
#          結果（各步驟 outcome、lane.json、a11y 摘要、預覽 dist）用 upload-artifact 交出去。
#   lane ：needs: test，有寫入權限。只做 gh 呼叫（留言、標籤、合併、觸發部署）和 git 推 previews 分支。
#          不 checkout、不 npm ci、不執行 repo 內任何腳本（留言用 jq，不用 node）；artifact 一律當不可信資料，
#          下載後先驗證格式（列舉值、檔案清單比對 PR 實際變更）才使用。
#
# 第五十六輪（docs/deploy.md 第 28 節、docs/ci-scaling.md §6.1）：內容 PR 與程式 PR 分流、一個 PR 只建一次站、快取 Chromium。
#   純內容 PR（相對 origin/main 的每個變更檔都在 content/ 或 data/snapshots/）：個資掃描、build --check、npm run test:content、
#     lane.mjs、一次預覽建置、上傳；不跑 lint、format、typecheck、完整 npm test、Chromium 安裝與 axe。
#     為什麼安全：純內容 PR 沒有改任何程式，test job 執行的程式碼與 main 相同；合併後 pages.yml 在 main 上仍跑完整的
#     lint／format／typecheck／npm test，沒過就不部署。
#   其他 PR（含程式、測試、文件、工作流程、設定）：照舊全跑；axe 改掃預覽建置（同一份 dist），不再另建一份 BASE_PATH='' 的站。
#   「純內容」在 test job 由 git diff 算出（決定跳過哪些步驟），lane job 再用 PR 的 API 檔案清單（含改名前的路徑）自己判定一次；
#   只有 lane job 判定為純內容時，被略過的程式檢查才算通過（留言顯示「略過（純內容變更）」），artifact 怎麼寫都不能讓程式 PR 免檢。
# 為什麼不用 pull_request_target：它在 base 分支的脈絡執行並預設帶寫入權杖，一旦 checkout PR 的程式碼就等於把寫入權杖交給 PR 作者
# （GitHub Security Lab 稱 "pwn request"）。目前只接受同 repo 分支的 PR（SAME_REPO）；若未來接受 fork，見 docs/deploy.md 第四十輪。
#
# 第六十八輪（docs/deploy.md 第 34 節）：審核人按 Approve（pull_request_review）時不再整套重跑。reuse job 用 API 找同一個 head commit
#   在 pull_request 事件已經跑完且成功的那次執行，lane job 直接下載它的 lane-result artifact；找不到（還在跑、被取消、失敗、artifact 過期）
#   才跑 test job。artifact 綁定 head SHA，內容和重跑一次相同；lane job 本來就把它當不可信資料驗證、用 API 檔案清單自己算範圍與閘門。
on:
  pull_request:
    types: [opened, synchronize, reopened]
  # 一般車道：審核人按下 Approve 後再跑一次，核准＋檢查通過即合併（第六十八輪起沿用同一 commit 的檢查結果，不重跑 test job）
  pull_request_review:
    types: [submitted]

# 第二十三輪（26.5）：工作流程層級只給唯讀；寫入權限下放到需要的 job（第四十輪起只有 lane 一個 job 有寫入權限）。
# 第三方 action 一律固定 commit SHA（註解標版本），升級由 Dependabot（.github/dependabot.yml）開 PR。
permissions:
  contents: read

concurrency:
  group: content-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 第六十八輪：審核事件才跑。不 checkout、不執行 repo 內任何程式，只用 gh 查 API；權限只有 actions: read（讀執行紀錄與 artifact 清單）。
  # 條件：同一個 workflow、head_sha 相同、事件是 pull_request、結論 success、lane-result artifact 還在（保留 1 天；超過就重跑）。
  # 輸出 run_id 只能是整數（下面會驗），空字串代表「沒有可沿用的執行」。
  reuse:
    if: github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Find a successful run of this workflow for the same head commit (gh only)
        id: find
        run: |
          RUN_ID=""
          if [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            for id in $(gh api "repos/$REPO/actions/workflows/content-pr.yml/runs?head_sha=$HEAD_SHA&event=pull_request&status=success&per_page=5" \
                --jq '.workflow_runs[] | select(.head_sha == env.HEAD_SHA and .conclusion == "success") | .id' 2>/dev/null); do
              [[ "$id" =~ ^[0-9]+$ ]] || continue
              if [ -n "$(gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.name == "lane-result" and .expired == false) | .id' 2>/dev/null)" ]; then
                RUN_ID="$id"
                break
              fi
            done
          fi
          if [ -n "$RUN_ID" ]; then
            echo "沿用執行 $RUN_ID 的檢查結果（同一 head commit ${HEAD_SHA::7}，pull_request 事件、結論 success、artifact 未過期）；test job 不重跑"
          else
            echo "找不到可沿用的執行（還在跑、被取消、失敗或 artifact 已過期）：test job 照舊全跑"
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  test:
    # 第六十八輪：pull_request 事件 reuse 被略過（輸出為空）照常跑；審核事件只在找不到可沿用的執行時跑。!cancelled() 讓 reuse 失敗時也照常跑。
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run_id == '' }}
    runs-on: ubuntu-latest
    # 執行 PR 程式碼的 job：只有唯讀權杖，而且步驟都不把 GITHUB_TOKEN 放進環境變數（唯一例外是查 team 那一步，只跑 gh 指令）
    permissions:
      contents: read
    env:
      PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
      # 第二十三輪（26.3）：PR 作者；lanes.json 的 allowedAuthors 決定能不能走自動合併車道
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # 不把權杖留在 .git/config：後面的 npm ci／npm test 讀得到工作目錄，卻讀不到權杖
          persist-credentials: false

      # 第五十六輪：分流。在 npm ci 之前、只用 git 算出變更檔（--no-renames：改名的新舊路徑都列，把 scripts/x 改名成 content/x 也算動到程式）。
      # 每個檔都在 content/ 或 data/snapshots/ ⇒ content_only=true，下面的程式檢查跳過；沒有變更檔也當程式 PR（全跑）。
      # 這只決定 test job 跑什麼；合併與否看 lane job 自己用 API 檔案清單算的結果（見「Validate results」）。
      - name: Classify changes (content-only or code)
        id: scope
        run: |
          git diff --name-only --no-renames origin/main...HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          if [ -s "$RUNNER_TEMP/changed.txt" ] && ! grep -Ev '^(content|data/snapshots)/' "$RUNNER_TEMP/changed.txt" > /dev/null; then
            echo "content_only=true" >> "$GITHUB_OUTPUT"
            echo "純內容變更：只跑內容閘門（個資、build --check、test:content、車道、預覽）"
          else
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            echo "含程式／文件變更（或沒有變更檔）：全部檢查"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm

      - name: Install
        run: npm ci

      # 第三十輪（#55）：個資掃描。只掃這個 PR 改到（新增／修改）的檔，範圍外（程式、測試、文件）的檔由腳本自己略過；
      # 有命中（身分證、居留證、手機、個人信箱、名單語境裡的姓名）就擋合併。全庫範圍在下面的治理閘門（build.mjs --check）再掃一次。
      # 輸出只有遮罩過的片段，不會把號碼印進公開的 Actions 紀錄。
      - name: PII scan (changed files)
        id: pii
        continue-on-error: true
        run: git diff --name-only -z --diff-filter=d origin/main...HEAD | xargs -0 node scripts/pii-scan.mjs

      # 以下四項（lint、格式、型別、完整 npm test）只在程式 PR 跑；純內容 PR 的程式與 main 相同，合併後 pages.yml 會再全跑一次。
      - name: Lint (eslint)
        id: lint
        if: steps.scope.outputs.content_only != 'true'
        continue-on-error: true
        run: npm run lint

      # 第四十輪（#82）：格式與型別檢查也進 CI。main 上曾經 format:check 紅了好幾輪沒人發現，就是因為它不在任何工作流程裡；
      # Prettier 只強制用在 .prettierignore 放行清單裡的新檔，所以這一步不會要求重排既有程式碼。
      - name: Format check (prettier, allow-listed new files)
        id: format
        if: steps.scope.outputs.content_only != 'true'
        continue-on-error: true
        run: npm run format:check

      - name: Type check (tsc, files with // @ts-check)
        id: typecheck
        if: steps.scope.outputs.content_only != 'true'
        continue-on-error: true
        run: npm run typecheck

      - name: Tests (governance rules)
        id: test
        if: steps.scope.outputs.content_only != 'true'
        continue-on-error: true
        run: npm test

      # 第五十六輪：純內容 PR 只跑「驗證已提交內容」的測試子集（package.json 的 test:content；清單與加入規則見 docs/deploy.md 第 28 節）。
      # 程式 PR 不跑這一步：完整的 npm test 已經包含這些檔。
      - name: Content tests (npm run test:content)
        id: content_test
        if: steps.scope.outputs.content_only == 'true'
        continue-on-error: true
        run: npm run test:content

      - name: Build check (schema + governance + eval gate)
        id: check
        continue-on-error: true
        run: BUILD_TODAY=2026-10-01 node scripts/build.mjs --check

      # 個人帳號的 repo 沒有 team；組織的 team 清單需要 read:org，GITHUB_TOKEN 給不了，查不到就留空（與拆分前行為相同）。
      # 這一步只跑 gh 指令，不執行 repo 內任何東西，所以權杖只放在這一步的 env。
      - name: Lookup author teams (gh only)
        id: teams
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEAMS=$(gh api "orgs/${GITHUB_REPOSITORY_OWNER}/teams" --paginate --jq '.[].slug' 2>/dev/null | while read -r slug; do
            if gh api "orgs/${GITHUB_REPOSITORY_OWNER}/teams/$slug/memberships/$PR_AUTHOR" --silent 2>/dev/null; then printf '%s/%s,' "$GITHUB_REPOSITORY_OWNER" "$slug"; fi
          done || true)
          echo "teams=$TEAMS" >> "$GITHUB_OUTPUT"

      - name: Lane (changed files → lane, reviewers, SLA)
        id: lane
        env:
          TEAMS: ${{ steps.teams.outputs.teams }}
        run: |
          # 檔案清單取自「Classify changes」的 git diff --name-only --no-renames origin/main...HEAD（改名的新舊路徑都列，與 lane job 的 API 清單一致）
          mkdir -p "$RUNNER_TEMP/result"
          node scripts/lane.mjs --since="$PR_CREATED_AT" --author="$PR_AUTHOR" --teams="$TEAMS" --files-from="$RUNNER_TEMP/changed.txt" < /dev/null > "$RUNNER_TEMP/result/lane.json"
          cat "$RUNNER_TEMP/result/lane.json"

      # 第五十六輪：一個 PR 只建一次站。以前 a11y 另建一份 BASE_PATH='' 的站（靜態伺服器不用處理子路徑），預覽再建一份；
      # scripts/a11y.mjs 本來就認得 BASE_PATH（把網址的前綴去掉再找檔），所以 axe 直接掃這份預覽 dist，省一次完整建置（約 30 秒）。
      # 這份 dist 有 /pagefind/（build.mjs 內建索引），axe 掃得到 /search/ 的結果列；預覽也因此能直接搜這個 PR 的內容。
      # 審核（pull_request_review）重跑時不推預覽：純內容 PR 不必建；程式 PR 仍要建，給 axe 掃。
      - name: Build preview (also scanned by axe)
        id: preview_build
        if: steps.check.outcome == 'success' && (github.event_name == 'pull_request' || steps.scope.outputs.content_only != 'true')
        continue-on-error: true
        env:
          BASE_PATH: /${{ github.event.repository.name }}/preview/pr-${{ github.event.pull_request.number }}
          BUILD_TODAY: 2026-10-01
          SITE_URL: https://${{ github.repository_owner }}.github.io
          # 預覽不因連結檢查卡住（主站建置仍是 error 閘門）
          LINK_CHECK: warn
          # 預覽要讓審核人看得到排程中（publishAt 未到）的內容；主站照真實時間
          PREVIEW_SCHEDULED: '1'
          DIST_DIR: ${{ runner.temp }}/preview-dist
        run: npm run build

      # 第二十四輪（ARCHITECTURE 27）：無障礙檢測，Playwright＋axe-core 掃代表頁（桌機 1280／手機 320／文字 200%）；
      # serious／critical 或橫向捲動 → 失敗並擋合併。只在程式 PR 跑：純內容 PR 沒改版型，掃出來的結果與 main 相同。
      # 第五十六輪：Chromium 快取。key 是 package-lock.json 的 playwright-core 版本（瀏覽器版本跟著它走）。
      # 這裡只「還原」（actions/cache/restore），不寫入：快取只由 pages.yml 在 main 上存，PR 的程式碼碰不到別人會用的快取。
      # 有快取時 playwright install 只補系統套件（--with-deps），不再下載瀏覽器。
      - name: Playwright version (Chromium cache key)
        id: pw
        if: steps.scope.outputs.content_only != 'true'
        run: echo "version=$(jq -r '.packages["node_modules/playwright-core"].version // "none"' package-lock.json | tr -cd '0-9A-Za-z.-')" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium cache (saved by pages.yml on main)
        if: steps.scope.outputs.content_only != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium for a11y check
        id: a11y_browser
        if: steps.scope.outputs.content_only != 'true'
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      # 第四十輪（#83）：A11Y_JSON 另外輸出機器可讀的數字（阻擋數、moderate／minor 警告數與規則別次數），
      # 下面「Collect results」收進 result.json，PR 留言的無障礙列就看得到「不擋合併但有 N 項警告」。
      # BASE_PATH 與預覽建置相同：a11y.mjs 的靜態伺服器把這個前綴去掉再對應到 DIST_DIR。
      - name: Accessibility check (axe-core, on the preview build)
        id: a11y
        if: steps.scope.outputs.content_only != 'true' && steps.preview_build.outcome == 'success' && steps.a11y_browser.outcome == 'success'
        continue-on-error: true
        env:
          DIST_DIR: ${{ runner.temp }}/preview-dist
          BASE_PATH: /${{ github.event.repository.name }}/preview/pr-${{ github.event.pull_request.number }}
          A11Y_REPORT: ${{ runner.temp }}/a11y-report.md
          A11Y_JSON: ${{ runner.temp }}/a11y-summary.json
        run: npm run a11y

      # 把各步驟的 outcome 收成一個 JSON 交給 lane job。outcome 由工作流程運算式帶入（不是 PR 程式碼寫的），
      # 但整個 artifact 仍當不可信資料：lane job 會再驗一次格式。always() 讓前面有步驟失敗時也能交出部分結果。
      - name: Collect results (outcomes and a11y summary into the artifact dir)
        if: always()
        env:
          O_PII: ${{ steps.pii.outcome }}
          O_LINT: ${{ steps.lint.outcome }}
          O_FORMAT: ${{ steps.format.outcome }}
          O_TYPECHECK: ${{ steps.typecheck.outcome }}
          O_TEST: ${{ steps.test.outcome }}
          O_CONTENT_TEST: ${{ steps.content_test.outcome }}
          O_CHECK: ${{ steps.check.outcome }}
          O_A11Y: ${{ steps.a11y.outcome }}
          O_PREVIEW_BUILD: ${{ steps.preview_build.outcome }}
          O_LANE: ${{ steps.lane.outcome }}
          # 只是 test job 的說法，lane job 不採信（會用 API 的檔案清單自己判定）
          SCOPE: ${{ steps.scope.outputs.content_only == 'true' && 'content' || 'full' }}
        run: |
          mkdir -p "$RUNNER_TEMP/result"
          [ -f "$RUNNER_TEMP/a11y-summary.json" ] || echo '{}' > "$RUNNER_TEMP/a11y-summary.json"
          jq -n --slurpfile a "$RUNNER_TEMP/a11y-summary.json" \
            --arg pii "$O_PII" --arg lint "$O_LINT" --arg format "$O_FORMAT" --arg typecheck "$O_TYPECHECK" \
            --arg test "$O_TEST" --arg content_test "$O_CONTENT_TEST" --arg check "$O_CHECK" --arg a11y "$O_A11Y" --arg preview_build "$O_PREVIEW_BUILD" --arg lane "$O_LANE" --arg scope "$SCOPE" \
            '{scope: $scope, outcomes: {pii: $pii, lint: $lint, format: $format, typecheck: $typecheck, test: $test, content_test: $content_test, check: $check, a11y: $a11y, preview_build: $preview_build, lane: $lane}, a11y: ($a[0] // {})}' \
            > "$RUNNER_TEMP/result/result.json"
          cat "$RUNNER_TEMP/result/result.json"

      - name: Upload results (lane.json, result.json)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lane-result
          path: ${{ runner.temp }}/result
          if-no-files-found: error
          retention-days: 1

      # 預覽 dist 只有建置成功才有。lane job 把它推到 previews 分支（那是 lane job 唯一碰到 PR 產物的地方，只複製檔案、不執行）。
      - name: Upload preview dist
        if: steps.preview_build.outcome == 'success' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preview-dist
          path: ${{ runner.temp }}/preview-dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      # 純內容 PR：程式檢查是 skipped，不算失敗，但 test:content 要過；程式 PR：照舊每一項都要 success。
      # （這裡只決定 test job 的紅綠；能不能合併由 lane job 依它自己判定的範圍決定。）
      - name: Fail when checks failed
        if: steps.check.outcome != 'success' || (steps.scope.outputs.content_only == 'true' && steps.content_test.outcome != 'success') || (steps.scope.outputs.content_only != 'true' && (steps.test.outcome != 'success' || steps.lint.outcome != 'success' || steps.format.outcome != 'success' || steps.typecheck.outcome != 'success' || steps.a11y.outcome != 'success')) || steps.pii.outcome != 'success'
        env:
          SCOPE: ${{ steps.scope.outputs.content_only == 'true' && '純內容' || '含程式／文件' }}
          O_CONTENT_TEST: ${{ steps.content_test.outcome }}
          O_TEST: ${{ steps.test.outcome }}
          O_LINT: ${{ steps.lint.outcome }}
          O_FORMAT: ${{ steps.format.outcome }}
          O_TYPECHECK: ${{ steps.typecheck.outcome }}
          O_CHECK: ${{ steps.check.outcome }}
          O_A11Y: ${{ steps.a11y.outcome }}
          O_PII: ${{ steps.pii.outcome }}
        run: |
          echo "範圍：$SCOPE；測試：$O_TEST；內容測試：$O_CONTENT_TEST；Lint：$O_LINT；格式：$O_FORMAT；型別：$O_TYPECHECK；治理閘門：$O_CHECK；無障礙檢測：$O_A11Y；個資掃描：$O_PII"
          exit 1

  lane:
    needs: [reuse, test]
    # test 失敗（檢查沒過）時 lane 仍要跑：留言、貼標籤、把「擋合併」的原因寫出來；test 因沿用而略過時也要跑。只有整個工作流程被取消才跳過。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # 推 previews 分支、合併 PR
      pull-requests: write # 留言、標籤、合併
      issues: write # 建立標籤、編輯留言（PR 留言走 issues API）
      actions: write # gh workflow run pages.yml
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      # 分叉來的 PR 拿不到寫入權杖：只跑檢查，不推預覽、不留言、不合併
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${{ github.event.pull_request.number }}/
      # 第六十八輪：沿用的執行 id（空＝這次自己跑的 test job）。只在留言裡標示；artifact 的驗證與閘門計算不因此放寬
      REUSE_RUN: ${{ needs.reuse.outputs.run_id }}
    # 這個 job 沒有 checkout、沒有 setup-node、沒有 npm：能執行的只有 runner 內建的 bash／jq／git／gh 和下面釘住 SHA 的 download-artifact。
    steps:
      - name: Download results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lane-result
          path: ${{ runner.temp }}/result
          # 第六十八輪：審核事件沿用同一 head commit 上一次執行的 artifact（reuse job 驗過是整數）；平常就是這次執行
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # artifact 是 PR 程式碼產生的，一律當資料：每個值都過列舉／格式檢查才寫進 GITHUB_ENV（所以不可能夾帶換行或其他變數），
      # lane.json 的檔案清單必須涵蓋 PR 實際變更的每個檔（用 API 查，不信 artifact），否則不採用。
      # 第五十六輪：「純內容」由這一步自己用 API 的檔案清單判定（不看 artifact 的 scope），並在這裡算出唯一的合併閘門 GATE：
      #   個資掃描、治理閘門一律要 success；lint、格式、型別、npm test、axe 要 success，或「純內容 PR 而且是 skipped」（content-skip）；
      #   內容測試要 success，或 npm test 已 success（covered：完整測試含這些檔）。content-skip／covered 只能由這一步產生，
      #   artifact 裡出現這兩個字會先被列舉檢查變成 invalid。Decide merge 與最後的 Fail 都只看 GATE。
      - name: Validate results (artifact is untrusted data)
        id: load
        env:
          DOWNLOAD: ${{ steps.download.outcome }}
        run: |
          D="$RUNNER_TEMP/result"
          fail() { echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::error::$1"; exit 0; }
          : > "$RUNNER_TEMP/env.txt"
          [ "$DOWNLOAD" = "success" ] || fail "找不到 test job 的結果 artifact（test job 可能在上傳前就失敗）"
          [ -s "$D/result.json" ] && [ -s "$D/lane.json" ] || fail "結果 artifact 缺 result.json 或 lane.json"
          jq -e . "$D/result.json" > /dev/null && jq -e . "$D/lane.json" > /dev/null || fail "結果不是合法 JSON"
          # PR 實際變更的檔（API，不信 artifact）。改名的檔兩個路徑都列：把 scripts/x 改名成 content/x 也算動到程式。
          # 檔案 API 最多列 3000 個；列出的檔數少於 PR 的 changedFiles 就無法驗證，不採用。
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | "f \(.filename)", (.previous_filename // empty | "p \(.)")' > "$RUNNER_TEMP/real-raw.txt" || fail "查不到 PR 的檔案清單"
          TOTAL="$(gh pr view "$PR" -R "$REPO" --json changedFiles --jq .changedFiles)" || fail "查不到 PR 的變更檔數"
          LISTED="$(grep -c '^f ' "$RUNNER_TEMP/real-raw.txt" || true)"
          [[ "$TOTAL" =~ ^[0-9]+$ ]] || fail "PR 的變更檔數不是整數"
          [ "$LISTED" -ge "$TOTAL" ] || fail "檔案 API 只列出 $LISTED／$TOTAL 個變更檔，無法驗證，不採用"
          cut -c3- "$RUNNER_TEMP/real-raw.txt" | sort -u > "$RUNNER_TEMP/real-files.txt"
          CONTENT_ONLY=false
          if [ -s "$RUNNER_TEMP/real-files.txt" ] && ! grep -Ev '^(content|data/snapshots)/' "$RUNNER_TEMP/real-files.txt" > /dev/null; then CONTENT_ONLY=true; fi
          CLAIM="$(jq -r '.scope // "" | tostring' "$D/result.json")"
          if [ "$CLAIM" = "content" ] && [ "$CONTENT_ONLY" != "true" ]; then echo "::warning::test job 判定為純內容，但 PR 實際含程式／文件變更：被略過的檢查一律當未通過"; fi
          declare -A O
          for k in pii lint format typecheck test content_test check a11y preview_build lane; do
            v="$(jq -r --arg k "$k" '.outcomes[$k] // "skipped" | tostring' "$D/result.json")"
            case "$v" in success | failure | skipped | cancelled) ;; *) v=invalid ;; esac
            case "$k" in
              lint | format | typecheck | test | a11y)
                if [ "$CONTENT_ONLY" = "true" ] && [ "$v" = "skipped" ]; then v=content-skip; fi
                ;;
            esac
            O[$k]="$v"
          done
          if [ "${O[content_test]}" = "skipped" ] && [ "${O[test]}" = "success" ]; then O[content_test]=covered; fi
          GATE=pass
          for k in pii check; do
            [ "${O[$k]}" = "success" ] || GATE=fail
          done
          for k in lint format typecheck test a11y content_test; do
            case "${O[$k]}" in success | content-skip | covered) ;; *) GATE=fail ;; esac
          done
          echo "範圍（API 檔案清單）：$([ "$CONTENT_ONLY" = "true" ] && echo 純內容 || echo 含程式／文件)；閘門：$GATE"
          for k in pii lint format typecheck test content_test check a11y preview_build lane; do
            echo "$(echo "$k" | tr '[:lower:]' '[:upper:]')=${O[$k]}" >> "$RUNNER_TEMP/env.txt"
          done
          LANE="$(jq -r '.lane | tostring' "$D/lane.json")"
          LABEL="$(jq -r '.ghLabel | tostring' "$D/lane.json")"
          AUTO="$(jq -r '.autoMerge | tostring' "$D/lane.json")"
          NEED="$(jq -r '.requiredApprovals | tostring' "$D/lane.json")"
          [[ "$LANE" =~ ^(emergency|fast|standard)$ ]] || fail "lane 不是已知車道"
          [[ "$LABEL" =~ ^lane:(emergency|fast|standard)$ ]] || fail "ghLabel 不合法"
          [[ "$AUTO" =~ ^(true|false)$ ]] || fail "autoMerge 不是布林"
          [[ "$NEED" =~ ^[0-9]$ ]] || fail "requiredApprovals 不是 0 到 9 的整數"
          # 第六十輪（Issue #125）：能不能免人審自動合併，由這一步依 API 的檔案清單判定，不採信 artifact 算出的車道。
          # artifact 的 lane.json 是 test job 用 PR 自己的 scripts/lane.mjs＋content/governance/lanes.json 算的，惡意 PR 可以連規則一起改。
          # 規則：不是純內容（改到程式、工作流程、文件、測試…），或改到治理設定（content/governance/，車道規則就在這裡）、主檔（content/master/），
          # 一律覆寫成一般車道：不自動合併、至少 1 位核准。純內容 PR 動不到 lane.mjs 與 lanes.json，所以剩下的車道判定可以信 artifact。
          # 這也回答了「改車道規則的 PR 走哪條路」：一般車道，由 codeReviewers（OASIS）審。
          DOWNGRADED=false
          RULES=false
          if grep -E '^content/(governance|master)/' "$RUNNER_TEMP/real-files.txt" > /dev/null; then RULES=true; fi
          if [ "$AUTO" = "true" ] || [ "$LANE" != "standard" ]; then
            if [ "$CONTENT_ONLY" != "true" ] || [ "$RULES" = "true" ]; then
              echo "::warning::artifact 的車道是 $LANE（autoMerge=$AUTO），但 PR 依 API 檔案清單$([ "$RULES" = "true" ] && echo '改到治理設定／主檔' || echo '不是純內容')：覆寫為一般車道、不自動合併、至少 1 位核准"
              LANE=standard; LABEL=lane:standard; AUTO=false; DOWNGRADED=true
              [ "$NEED" -ge 1 ] || NEED=1
            fi
          fi
          # 比對檔案清單：artifact 說的檔案必須涵蓋 PR 實際改到的每個檔（不能少報；real-files.txt 在上面由 API 取得）
          jq -r '.files[].file' "$D/lane.json" | sort -u > "$RUNNER_TEMP/lane-files.txt"
          MISSING="$(comm -23 "$RUNNER_TEMP/real-files.txt" "$RUNNER_TEMP/lane-files.txt" | head -n 3)"
          [ -z "$MISSING" ] || fail "lane.json 的檔案清單漏了 PR 實際變更的檔，不採用：$MISSING"
          # a11y 警告數與規則別次數（只留數字與規則 id，會原樣放進 PR 留言）
          WARN="$(jq -r '.a11y.warnings // 0 | tostring' "$D/result.json")"
          [[ "$WARN" =~ ^[0-9]+$ ]] || WARN=0
          RULES="$(jq -r '[.a11y.warningRules // {} | to_entries[] | select((.key | test("^[a-z0-9-]+$")) and (.value | type == "number")) | "\(.key)×\(.value)"] | join("、")' "$D/result.json")"
          {
            echo "LANE=$LANE"
            echo "LABEL=$LABEL"
            echo "AUTO=$AUTO"
            echo "NEED=$NEED"
            echo "A11Y_WARN=$WARN"
            echo "A11Y_RULES=$RULES"
            echo "CONTENT_ONLY=$CONTENT_ONLY"
            echo "DOWNGRADED=$DOWNGRADED"
            echo "GATE=$GATE"
          } >> "$RUNNER_TEMP/env.txt"
          # 全部驗證通過才一次寫進 GITHUB_ENV（中途 fail 的話後面的步驟看不到任何一個值，GATE 也不存在）
          cat "$RUNNER_TEMP/env.txt" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Download preview dist
        id: download_preview
        if: steps.load.outputs.ok == 'true' && env.PREVIEW_BUILD == 'success' && github.event_name == 'pull_request' && env.SAME_REPO == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: preview-dist
          path: ${{ runner.temp }}/preview-dist

      - name: Push preview to previews branch (pr-N/)
        id: preview_push
        if: steps.download_preview.outcome == 'success' && env.SAME_REPO == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          W="$RUNNER_TEMP/previews"
          # previews 分支只保留一個快照提交（孤兒提交、force-with-lease），避免每次預覽都累積 100MB 歷史；
          # 只覆蓋 pr-N/，其他 PR 的目錄原樣保留；被別人搶先推送 ⇒ lease 失敗 ⇒ 重新取出再試。
          for attempt in 1 2 3 4 5; do
            rm -rf "$W"
            if git ls-remote --exit-code --heads "$URL" previews >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch previews --single-branch "$URL" "$W"
              OLD="$(git -C "$W" rev-parse HEAD)"
            else
              git init --quiet "$W"
              git -C "$W" remote add origin "$URL"
              OLD=""
            fi
            rm -rf "$W/pr-$PR"
            mkdir -p "$W/pr-$PR"
            cp -R "$RUNNER_TEMP/preview-dist/." "$W/pr-$PR/"
            printf '# PR 預覽\n\n由 .github/workflows/content-pr.yml 自動維護（每個 PR 一個 pr-N/ 目錄），主站部署時複製到 /preview/。請勿手動修改。\n' > "$W/README.md"
            touch "$W/.nojekyll"
            git -C "$W" checkout --quiet --orphan "snapshot-$attempt"
            git -C "$W" add -A
            git -C "$W" commit --quiet -m "preview: pr-$PR @ ${GITHUB_SHA::7}"
            if git -C "$W" push --quiet --force-with-lease="previews:${OLD}" origin HEAD:previews; then
              echo "預覽已推送：$PREVIEW_URL"
              exit 0
            fi
            echo "push 失敗（第 $attempt 次），重試…"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Decide merge (checks + lane + approvals)
        id: decide
        if: steps.load.outputs.ok == 'true' && env.SAME_REPO == 'true'
        env:
          STATE: ${{ github.event.pull_request.state }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          # 每位審核人只看最新一則（COMMENTED 不算），state 為 APPROVED 才計數
          APPROVALS=$(gh pr view "$PR" -R "$REPO" --json reviews --jq '[.reviews[] | select(.state != "COMMENTED")] | group_by(.author.login) | map(max_by(.submittedAt)) | map(select(.state == "APPROVED")) | length')
          echo "approvals=$APPROVALS" >> "$GITHUB_OUTPUT"
          # 第五十六輪：檢查是否通過只看 Validate results 算出的 GATE（純內容 PR 被略過的程式檢查已在那裡依 API 檔案清單判斷）
          if [ "$STATE" != "open" ]; then ACTION=closed
          elif [ "$GATE" != "pass" ]; then ACTION=blocked
          elif [ "$DRAFT" = "true" ]; then ACTION=draft
          elif [ "$AUTO" = "true" ]; then ACTION=merge
          elif [ "$APPROVALS" -ge "$NEED" ]; then ACTION=merge
          else ACTION=wait
          fi
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "決定：$ACTION（核准 $APPROVALS／需 $NEED）"

      - name: Comment on PR (lane, checks, preview, SLA, reviewers)
        if: always() && env.SAME_REPO == 'true' && steps.load.outputs.ok == 'true'
        env:
          PREVIEW_PUSH: ${{ steps.preview_push.outcome }}
          ACTION: ${{ steps.decide.outputs.action }}
          APPROVALS: ${{ steps.decide.outputs.approvals }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 留言用 jq 產生（第四十輪：lane job 不執行 node 或 repo 內任何腳本）。這段 jq 程式寫在 workflow 裡，不來自 artifact。
          cat > "$RUNNER_TEMP/comment.jq" <<'JQ'
          def icon($o): ({"success": "✅ 通過", "failure": "❌ 失敗", "skipped": "⏭ 略過", "cancelled": "⏹ 取消", "content-skip": "⏭ 略過（純內容變更）", "covered": "—（已含在 npm test）"}[$o // ""] // "—");
          . as $L
          | $ENV as $e
          | ($e.APPROVALS // "0") as $ap
          # 第六十輪（Issue #125）：車道、自動合併、核准人數以 Validate results 依 API 檔案清單核對後的環境變數為準，不直接用 lane.json
          | ($e.AUTO == "true") as $auto
          | ($e.NEED // ($L.requiredApprovals | tostring)) as $need
          | ({"emergency": "緊急發布", "fast": "快車道", "standard": "一般車道"}[$e.LANE // ""] // $L.label) as $label
          | ($e.DOWNGRADED == "true") as $downgraded
          | ({
              "merge": (if $auto then "✅ 檢查全數通過，" + $label + "自動合併（squash），約 3 分鐘後上線" else "✅ 已有核准且檢查通過，合併（squash）" end),
              "wait": ("⏳ 等待審核：需 " + $need + " 位核准（目前 " + $ap + "）；SLA 至 " + $L.sla.dueAtLocal + "（台灣時間）"),
              "blocked": "❌ 檢查未通過，不合併：請看下方檢查與執行紀錄",
              "draft": "📝 草稿 PR：轉為 Ready for review 後才會合併",
              "closed": "PR 已關閉"
            }[$e.ACTION // ""] // "—") as $action
          | ($e.PREVIEW_PUSH == "success") as $previewOk
          | (($e.A11Y_WARN // "0") | tonumber? // 0) as $warn
          | [
              "<!-- lane-bot -->",
              "### 發布車道：" + $label + "（`" + ($e.LABEL // $L.ghLabel) + "`）",
              "",
              $action,
              "",
              "| 項目 | 結果 |",
              "| --- | --- |",
              "| 變更範圍 | " + (if $e.CONTENT_ONLY == "true" then "純內容（content/、data/snapshots/）：只跑內容閘門，程式檢查略過（合併後 main 上全跑）" else "含程式／文件：全部檢查" end) + " |",
              "| 檢查結果來源 | " + (if ($e.REUSE_RUN // "") != "" then "沿用同一 commit 的[上一次執行](" + ($e.RUN_URL | sub("/runs/[0-9]+$"; "/runs/" + $e.REUSE_RUN)) + ")（審核後不重跑）" else "本次執行" end) + " |",
              "| 測試（npm test） | " + icon($e.TEST) + " |",
              "| 內容測試（npm run test:content） | " + icon($e.CONTENT_TEST) + " |",
              "| Lint（eslint） | " + icon($e.LINT) + " |",
              "| 格式（prettier，放行清單內的新檔） | " + icon($e.FORMAT) + " |",
              "| 型別檢查（tsc，檔首有 @ts-check 的檔） | " + icon($e.TYPECHECK) + " |",
              "| 治理閘門（schema、參照、評估集版本題） | " + icon($e.CHECK) + " |",
              "| 無障礙檢測（axe） | " + icon($e.A11Y) + (if $warn > 0 then "（另有 " + ($warn | tostring) + " 項 moderate／minor 警告，不擋合併" + (if ($e.A11Y_RULES // "") != "" then "：" + $e.A11Y_RULES else "" end) + "）" else "" end) + " |",
              "| 個資掃描（身分證、居留證、手機、個人信箱、名單姓名） | " + icon($e.PII) + " |",
              "| 預覽建置 | " + icon($e.PREVIEW_BUILD) + " |",
              "| 預覽網址 | " + (if $previewOk then "[" + $e.PREVIEW_URL + "](" + $e.PREVIEW_URL + ")（主站重新部署後約 2–3 分鐘可開；含排程中內容）" else "未產生" end) + " |",
              "| 自動合併 | " + (if $auto then "是（不需人工核准）" else "否（需 " + $need + " 位核准）" end) + " |",
              "| 車道核對（API 檔案清單） | " + (if $downgraded then "⚠ PR 改到程式／文件／治理設定／主檔，不採信 PR 自己算的車道「" + $L.label + "」，覆寫為一般車道（需人審）" else "✅ 與 PR 算出的車道一致" end) + " |",
              "| 作者授權 | " + (if $L.authorGate then (if $L.authorGate.allowed then "✅ " + $L.authorGate.reason else "⚠ " + $L.authorGate.reason + "，降為一般車道" end) else "—（本車道本來就需人審）" end) + " |",
              "| 審核人 | " + (if ($L.reviewers | length) > 0 then ($L.reviewerNames | join("、")) + "（" + ([$L.reviewerAccounts[] | "@" + .] | join(" ")) + "）" else "無（CI 即審核者）" end) + " |",
              "| 上線後複核 | " + (if $L.postPublishReview then $L.postPublishReview.ownerName + " 於上線後 " + ($L.postPublishReview.hours | tostring) + " 小時內" else "—" end) + " |",
              "| SLA | " + $L.sla.label + "，到期 " + $L.sla.dueAtLocal + "（台灣時間） |",
              "",
              "<details><summary>車道判定依據（" + ($L.files | length | tostring) + " 個檔案）</summary>",
              "",
              ($L.reasons[] | "- " + .),
              "",
              "</details>",
              "",
              "[執行紀錄](" + $e.RUN_URL + ")"
            ]
          | join("\n")
          JQ
          jq -r -f "$RUNNER_TEMP/comment.jq" "$RUNNER_TEMP/result/lane.json" > "$RUNNER_TEMP/comment.md"
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- lane-bot -->"))) | .id' | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Comment when test job produced no usable results
        if: always() && env.SAME_REPO == 'true' && steps.load.outputs.ok != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '<!-- lane-bot -->\n### 發布車道：無法判定\n\n❌ test job 沒有產出可用的結果（可能在上傳前就失敗，或結果未通過格式驗證），不合併。請看[執行紀錄](%s)。\n' "$RUN_URL" > "$RUNNER_TEMP/comment.md"
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- lane-bot -->"))) | .id' | head -n1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" -R "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Label lane
        if: always() && env.SAME_REPO == 'true' && steps.load.outputs.ok == 'true'
        run: |
          case "$LABEL" in
            lane:emergency) COLOR=b60205; DESC="緊急發布：檢查通過即上線，24 小時內上線後複核" ;;
            lane:fast) COLOR=0e8a16; DESC="快車道：檢查通過即自動合併，24 小時內上線後複核" ;;
            *) COLOR=1d76db; DESC="一般車道：檢查通過＋1 位核准才合併" ;;
          esac
          gh label list -R "$REPO" --limit 200 --json name --jq '.[].name' | grep -qx "$LABEL" || gh label create "$LABEL" -R "$REPO" --color "$COLOR" --description "$DESC" || true
          for other in lane:emergency lane:fast lane:standard; do
            if [ "$other" != "$LABEL" ]; then gh pr edit "$PR" -R "$REPO" --remove-label "$other" > /dev/null 2>&1 || true; fi
          done
          gh pr edit "$PR" -R "$REPO" --add-label "$LABEL"

      # 第五十六輪：--match-head-commit：只合併這次檢查的那個 head。檢查期間作者又推了新 commit（例如純內容 PR 再補一個程式檔）
      # ⇒ head 不符、不合併；新的推送會觸發新的一輪檢查。
      - name: Merge (squash)
        id: merge
        if: env.SAME_REPO == 'true' && steps.decide.outputs.action == 'merge'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if gh pr merge "$PR" -R "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            gh pr comment "$PR" -R "$REPO" --body "<!-- lane-bot-merge -->自動合併失敗（可能與 main 衝突或分支保護規則不允許）。請更新分支後重新推送，或由審核人手動合併。"
            exit 1
          fi

      - name: Redeploy main site (gh workflow run pages.yml)
        # 預覽推送後要讓主站把 previews 複製到 /preview/；合併後 GITHUB_TOKEN 的 push 不會觸發 pages.yml，要自己觸發
        if: always() && env.SAME_REPO == 'true' && (steps.preview_push.outcome == 'success' || steps.merge.outputs.merged == 'true')
        run: gh workflow run pages.yml --ref main -R "$REPO" -f refresh=false

      - name: Fail when checks failed
        if: always() && (steps.load.outputs.ok != 'true' || env.GATE != 'pass')
        run: |
          echo "閘門：${GATE:-?}（純內容：${CONTENT_ONLY:-?}）；測試：${TEST:-?}；內容測試：${CONTENT_TEST:-?}；Lint：${LINT:-?}；格式：${FORMAT:-?}；型別：${TYPECHECK:-?}；治理閘門：${CHECK:-?}；無障礙檢測：${A11Y:-?}；個資掃描：${PII:-?}"
          exit 1
