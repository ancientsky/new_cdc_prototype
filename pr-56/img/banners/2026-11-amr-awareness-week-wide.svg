<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d"><title id="t">示意插畫：人、動物、環境三個相扣的圓圈，中央是盾牌與膠囊</title><desc id="d">三個互相重疊的大圓分別代表人（成人與孩童）、動物（乳牛）與環境（樹與水），重疊的中央有一面盾牌與一顆膠囊，象徵人、動物、環境防疫一體共同對抗抗藥性；周圍漂浮著細菌與藥丸。主體在畫面右側，左側為淡紫藍色背景與零星的藥丸。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef0f7"/><stop offset="1" stop-color="#dde3f0"/></linearGradient></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#bg)" /><circle cx="160" cy="120" r="190" fill="#fff" opacity=".45"/><circle cx="330" cy="600" r="150" fill="#c7d0e6" opacity=".5"/><g transform="translate(130 330) rotate(-30) scale(1)"><path d="M-40 0a20 20 0 0 1 20 -20h20v40h-20a20 20 0 0 1 -20 -20z" fill="#9fb0d6"/><path d="M0 -20h20a20 20 0 0 1 0 40h-20z" fill="#c7d0e6"/></g><g transform="translate(330 210) rotate(40) scale(1)"><path d="M-40 0a20 20 0 0 1 20 -20h20v40h-20a20 20 0 0 1 -20 -20z" fill="#b7c3e0"/><path d="M0 -20h20a20 20 0 0 1 0 40h-20z" fill="#dbe1f1"/></g><g transform="translate(250 470) rotate(10) scale(1)"><path d="M-40 0a20 20 0 0 1 20 -20h20v40h-20a20 20 0 0 1 -20 -20z" fill="#9fb0d6"/><path d="M0 -20h20a20 20 0 0 1 0 40h-20z" fill="#c7d0e6"/></g><g transform="translate(420 380) rotate(-50) scale(1)"><path d="M-40 0a20 20 0 0 1 20 -20h20v40h-20a20 20 0 0 1 -20 -20z" fill="#c7d0e6"/><path d="M0 -20h20a20 20 0 0 1 0 40h-20z" fill="#e3e8f4"/></g><g transform="translate(110 560) scale(0.8)"><ellipse rx="34" ry="20" fill="#b7a6d6"/><path d="M-24 -18v-10M-24 18v10" stroke="#b7a6d6" stroke-width="4" stroke-linecap="round"/><path d="M-8 -18v-10M-8 18v10" stroke="#b7a6d6" stroke-width="4" stroke-linecap="round"/><path d="M8 -18v-10M8 18v10" stroke="#b7a6d6" stroke-width="4" stroke-linecap="round"/><path d="M24 -18v-10M24 18v10" stroke="#b7a6d6" stroke-width="4" stroke-linecap="round"/><circle cx="-8" cy="-3" r="4" fill="#fff" opacity=".7"/><circle cx="10" cy="5" r="5" fill="#fff" opacity="