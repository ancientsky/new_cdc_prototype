<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d"><title id="t">示意插畫：里長與居民巡查住家周邊，倒掉水桶與容器的積水</title><desc id="d">夏日社區，穿橘色背心的里長拿著檢查表巡查，居民把水桶裡的積水倒掉；地上有輪胎、花盆底盤等容易積水的容器；右上角是被紅色禁止圈圈住的斑蚊。主體在畫面右側，左側為太陽、棕櫚與山坡。</desc><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c2"/><stop offset="1" stop-color="#dff0c0"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ccf7a"/><stop offset="1" stop-color="#7bb862"/></linearGradient><radialGradient id="sun"><stop offset="0" stop-color="#fff3a0"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1200" height="675" rx="0" fill="url(#sky)" /><circle cx="180" cy="150" r="150" fill="url(#sun)" /><circle cx="180" cy="150" r="70" fill="#ffd24a" /><path transform="rotate(0 180 150)" d="M180 40v-30" stroke="#ffd24a" stroke-width="8" stroke-linecap="round"/><path transform="rotate(45 180 150)" d="M180 40v-30" stroke="#ffd24a" stroke-width="8" stroke-linecap="round"/><path transform="rotate(90 180 150)" d="M180 40v-30" stroke="#ffd24a" stroke-width="8" stroke-linecap="round"/><path transform="rotate(135 180 150)" d="M180 40v-30" stroke="#ffd24a" stroke-width="8" stroke-linecap="round"/><path transform="rotate(180 180 150)" d="M180 40v-30" stroke="#ffd24a" stroke-width="8" stroke-linecap="round"/><path transform="rotate(225 180 150)" d="M180 40v-30" stroke="#ffd24a" stroke-width="8" stroke-linecap="round"/><path transform="rotate(270 180 150)" d="M180 40v-30" stroke="#ffd24a" stroke-width="8" stroke-linecap="round"/><path transform="rotate(315 180 150)" d="M180 40v-30" stroke="#ffd24a" stroke-width="8" stroke-linecap="round"/><g transform="translate(420 110) scale(1)" opacity="0.9" fill="#fff"><ellipse cx="0" cy="0" rx="70" ry="24"/><circle cx="-28" cy="-18" r="26"/><circle cx="20" cy="-26" r="32"/></g><g transform="translate(600 190